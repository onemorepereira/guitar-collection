AWSTemplateFormatVersion: '2010-09-09'
Description: Guitar Collection Frontend Infrastructure

Parameters:
  DomainName:
    Type: String
    Description: Domain name for the frontend (e.g., example.com)
    Default: your-domain.com

  BucketPrefix:
    Type: String
    Description: Prefix for the S3 bucket name (e.g., my-app-frontend)
    Default: my-app-frontend

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for your domain (required)

  ApiDomainName:
    Type: String
    Description: API domain the SPA calls (used in the CSP connect-src)
    Default: api.your-domain.com

  ImagesDomainName:
    Type: String
    Description: Images CDN domain the SPA loads from (used in the CSP img-src)
    Default: images.your-domain.com

Resources:
  # S3 Bucket for static website hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-${AWS::AccountId}'
      # Served only via CloudFront + OAI, so keep all public access blocked.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: prod

  # Bucket Policy for CloudFront access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${FrontendOAI}'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # CloudFront Origin Access Identity
  FrontendOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${DomainName}'

  # Security headers for the SPA (CSP, HSTS, anti-clickjacking, etc.)
  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${BucketPrefix}-frontend-security-headers'
        Comment: Security headers for the frontend SPA
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        # CSP ships in Report-Only mode first: browsers log violations to the
        # console without blocking anything, so a missed resource can't take
        # the live site down. Promote to an enforcing header (move into
        # SecurityHeadersConfig.ContentSecurityPolicy) once the console is
        # clean under real usage.
        CustomHeadersConfig:
          Items:
            - Header: Content-Security-Policy-Report-Only
              Override: true
              Value: !Sub >-
                default-src 'self';
                script-src 'self';
                style-src 'self' 'unsafe-inline';
                font-src 'self' data:;
                img-src 'self' data: https://${ImagesDomainName};
                connect-src 'self' https://${ApiDomainName};
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none';
                upgrade-insecure-requests

  # ACM Certificate for HTTPS
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  # URL router (viewer request): clean public URLs -> pre-rendered files, app routes ->
  # app.html, everything else falls through to S3 (403 without ListBucket) -> 404.html.
  # The code between ROUTER-BEGIN/END is tested by src/infra/router.test.ts and compared
  # with the live function by scripts/check-router-live.mjs before each frontend deploy.
  UrlRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${BucketPrefix}-url-router'
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URLs for pre-rendered pages, SPA shell for app routes, real 404s
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        // ROUTER-BEGIN
        var PUBLIC_PAGES = [
          '/faq',
          '/features/insurance-inventory',
          '/features/condition-reports',
          '/features/selling',
          '/features/ai-import'
        ];
        var APP_ROUTES = [
          '/login',
          '/register',
          '/forgot-password',
          '/reset-password',
          '/collection',
          '/account',
          '/add',
          '/documents',
          '/timeline',
          '/guitar',
          '/edit',
          '/s'
        ];

        function queryString(querystring) {
          var parts = [];
          for (var name in querystring) {
            var entry = querystring[name];
            var values = entry.multiValue ? entry.multiValue : [entry];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? name : name + '=' + values[i].value);
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function redirect(location) {
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: location } }
          };
        }

        function isPublicPage(path) {
          return PUBLIC_PAGES.indexOf(path) !== -1;
        }

        function isAppRoute(path) {
          for (var i = 0; i < APP_ROUTES.length; i++) {
            var p = APP_ROUTES[i];
            if (path === p || path.indexOf(p + '/') === 0) return true;
          }
          return false;
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var query = queryString(request.querystring || {});

          // 1. Pre-rendered files requested by name -> their clean URL
          if (uri === '/index.html') return redirect('/' + query);
          var suffix = '/index.html';
          if (uri.length > suffix.length && uri.slice(-suffix.length) === suffix) {
            var clean = uri.slice(0, -suffix.length);
            if (isPublicPage(clean)) return redirect(clean + query);
          }

          // 2. Files (last segment has a dot): serve as-is
          var last = uri.slice(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') !== -1) return request;

          // 3. Trailing slash on a public page -> slashless
          if (uri.length > 1 && uri.slice(-1) === '/' && isPublicPage(uri.slice(0, -1))) {
            return redirect(uri.slice(0, -1) + query);
          }

          // 4. Public pages -> pre-rendered file
          if (uri === '/') {
            request.uri = '/index.html';
            return request;
          }
          if (isPublicPage(uri)) {
            request.uri = uri + '/index.html';
            return request;
          }

          // 5. App routes -> SPA shell
          if (isAppRoute(uri)) {
            request.uri = '/app.html';
            return request;
          }

          // 6. Anything else: S3 403 -> CustomErrorResponses -> /404.html (404)
          return request;
        }
        // ROUTER-END

  # CloudFront Distribution
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CDN for ${DomainName}'
        # No DefaultRootObject: UrlRouterFunction rewrites / to /index.html itself
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${FrontendOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRouterFunction.FunctionMetadata.FunctionARN
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        # Missing files (S3 returns 403 to the OAI without ListBucket) get the branded 404 page
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Route53 DNS Record
  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref FrontendBucket
    Export:
      Name: frontend-bucket-name

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref FrontendDistribution
    Export:
      Name: frontend-distribution-id

  DistributionDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: frontend-distribution-domain

  WebsiteUrl:
    Description: Website URL
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: frontend-website-url

  UrlRouterFunctionName:
    Description: CloudFront Function that routes URLs (compared with the repo before each frontend deploy)
    Value: !Sub '${BucketPrefix}-url-router'
