AWSTemplateFormatVersion: '2010-09-09'
Description: Guitar Collection Frontend Infrastructure

Parameters:
  DomainName:
    Type: String
    Description: Domain name for the frontend (e.g., example.com)
    Default: your-domain.com

  BucketPrefix:
    Type: String
    Description: Prefix for the S3 bucket name (e.g., my-app-frontend)
    Default: my-app-frontend

  HostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for your domain (required)

  ApiDomainName:
    Type: String
    Description: API domain the SPA calls (used in the CSP connect-src)
    Default: api.your-domain.com

  ImagesDomainName:
    Type: String
    Description: Images CDN domain the SPA loads from (used in the CSP img-src)
    Default: images.your-domain.com

Resources:
  # S3 Bucket for static website hosting
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-${AWS::AccountId}'
      # Served only via CloudFront + OAI, so keep all public access blocked.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: prod

  # Bucket Policy for CloudFront access
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAI
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${FrontendOAI}'
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # CloudFront Origin Access Identity
  FrontendOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${DomainName}'

  # Security headers for the SPA (CSP, HSTS, anti-clickjacking, etc.)
  FrontendSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${BucketPrefix}-frontend-security-headers'
        Comment: Security headers for the frontend SPA
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
        # CSP ships in Report-Only mode first: browsers log violations to the
        # console without blocking anything, so a missed resource can't take
        # the live site down. Promote to an enforcing header (move into
        # SecurityHeadersConfig.ContentSecurityPolicy) once the console is
        # clean under real usage.
        CustomHeadersConfig:
          Items:
            - Header: Content-Security-Policy-Report-Only
              Override: true
              Value: !Sub >-
                default-src 'self';
                script-src 'self';
                style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                font-src 'self' data: https://fonts.gstatic.com;
                img-src 'self' data: https://${ImagesDomainName};
                connect-src 'self' https://${ApiDomainName};
                object-src 'none';
                base-uri 'self';
                form-action 'self';
                frame-ancestors 'none';
                upgrade-insecure-requests

  # ACM Certificate for HTTPS
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  # CloudFront Distribution
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CDN for ${DomainName}'
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${FrontendOAI}'
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ResponseHeadersPolicyId: !Ref FrontendSecurityHeadersPolicy
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # Route53 DNS Record
  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt FrontendDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront hosted zone ID (constant)
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Description: S3 bucket name
    Value: !Ref FrontendBucket
    Export:
      Name: frontend-bucket-name

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref FrontendDistribution
    Export:
      Name: frontend-distribution-id

  DistributionDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: frontend-distribution-domain

  WebsiteUrl:
    Description: Website URL
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: frontend-website-url
