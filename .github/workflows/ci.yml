name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime deps (src)
        working-directory: backend/src
        run: npm install --no-audit --no-fund
      - name: Install dev tooling (jest)
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: backend
        run: npm test

  templates:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - name: Lint templates
        run: cfn-lint backend/template.yaml frontend-infrastructure.yaml
